<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather in {{ title }}</title>
    <link href="{{ url_for('static', filename='styles/style.css') }}" rel="stylesheet" />
</head>
<body>
    <h1>Weather in {{ title }}</h1>
    <p><strong>Condition:</strong> {{ status }}</p>
    <p><strong>Temperature:</strong> {{ temp }} °F</p>
    <p><strong>Feels like:</strong> {{ feels_like }} °F</p>

    <hr>
    <h2>Check another city</h2>
    <form action="/weather">
        <input type="text" name="city" id="city" placeholder="Enter a City" />
        <button type="submit">Submit</button>
    </form>
</body>
</html>
